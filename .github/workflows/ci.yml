name: CI Test Suite

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ELEVENLABS_API_KEY: test-dummy-key
      MB_TEST_MODE: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # The server must be up BEFORE the gate: the unit suite the gate runs
      # (test:smoke) contains server-hitting tests that assume the node's
      # always-on :3100 listener. Without it every one of them waits out its
      # own timeout and the gate dies at its wall-clock cap — CI was red on
      # every push for exactly this, while the same gate passed on the Pi.
      - name: Start server (gate + unit + system tests run against it)
        run: |
          npm start &
          echo $! > /tmp/monsterbox-server.pid
          # Wait for the server to be ready on port 3100
          for i in $(seq 1 30); do
            if curl -s http://localhost:3100/ > /dev/null 2>&1; then
              echo "Server ready on port 3100"
              break
            fi
            sleep 1
          done
      - name: Run pre-deploy gate
        # Runner wall-clock is not Pi wall-clock: the scale loosens only the
        # step timeouts, never what the gate checks.
        run: MB_GATE_TIMEOUT_SCALE=10 npm run gate
      - name: Run unit tests
        run: npm run test:unit
      - name: Run system tests
        run: npm run test:system
      - name: Stop server
        if: always()
        run: |
          # The saved PID is the npm wrapper's; killing it does NOT reliably
          # take the node child down (the job-cleanup log showed node alive as
          # an orphan), and a surviving node makes the Playwright-spawned
          # server exit on the single-instance guard: "MonsterBox already
          # running". Kill the wrapper AND the node process, then give the
          # graceful shutdown a moment to release the PID lock file.
          if [ -f /tmp/monsterbox-server.pid ]; then
            kill $(cat /tmp/monsterbox-server.pid) 2>/dev/null || true
            rm -f /tmp/monsterbox-server.pid
          fi
          pkill -f "node server.js" 2>/dev/null || true
          sleep 3
          rm -f data/monsterbox.pid
      - name: Run browser tests
        run: npm run test:browser:quick
